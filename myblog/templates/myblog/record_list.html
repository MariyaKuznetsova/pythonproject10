{% extends 'myblog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for record in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ record.image | media_filter }}" style="max-width: 100%; height: 250px;">
                    <div class="card-body">
                        <p class="card-text">{{ record.title }}</p>
                        <p class="card-text">{{ record.contents }}</p>
                        <p class="card-text">{{ record.number_of_views }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="col-8">
                                <a class="btn btn-primary" href="{% url 'myblog:record_detail' record.pk %}" role="article">Посмотреть</a>
                                <a class="btn btn-primary" href="{% url 'myblog:record_update' record.pk %}" role="article">Редактировать</a>
                                </div>
                                <div class="col-5">
                                <a class="btn btn-danger" href="{% url 'myblog:record_delete' record.pk %}" role="article">Удалить</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
