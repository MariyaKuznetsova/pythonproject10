{% extends 'myblog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ record.image | media_filter }}" style="max-width: 100%; height: 250px;">
                    <div class="card-body">
                        <p class="card-text">Название: {{ object.title }}</p>
                        <p class="card-text">Описание: {{ object.contents }}</p>
                        <p class="card-text">Количество просмотров: {{ object.number_of_views }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'myblog:record_list' %}" role="article">Назад</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
